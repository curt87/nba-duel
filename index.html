<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d428a">
<meta name="description" content="用工资帽组建你的首发五人，挑一支真实球队打一场 —— 看看哪套阵容更可能赢，以及为什么。">
<meta property="og:title" content="首发五人对决">
<meta property="og:description" content="用工资帽组建你的首发五人，挑一支真实球队打一场 —— 看看哪套阵容更可能赢，以及为什么。">
<meta property="og:type" content="website">
<title>首发五人对决 · NBA 2026-27</title>
<style>
:root{
  --bg:#f1f4f9; --panel:#ffffff; --panel2:#f7f9fc; --line:#e4e9f1; --line2:#eef1f6;
  --text:#141821; --muted:#6b7280; --dim:#9aa3b0;
  --blue:#1d428a; --blue-l:#e9eef9; --red:#c8102e; --red-l:#fdecef;
  --gold:#b8860b; --gold-l:#fdf6e3; --green:#1f7a4d; --green-l:#e7f5ee;
  --gray:#6b7280; --gray-l:#eef0f3;
  --shadow:0 1px 2px rgba(20,24,33,.05), 0 8px 22px -12px rgba(20,24,33,.18);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text); line-height:1.55; font-size:14px;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
body.noscroll{overflow:hidden}
a{color:var(--blue);text-decoration:none}
.mono{font-family:var(--mono)}
.hide{display:none!important}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:9px;padding:10px 14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15.5px;letter-spacing:-.2px;white-space:nowrap}
.ball{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#e06a2b,#c8102e);position:relative;flex:none}
.ball:before,.ball:after{content:"";position:absolute;background:rgba(255,255,255,.78)}
.ball:before{left:50%;top:0;bottom:0;width:1.4px;transform:translateX(-50%)}
.ball:after{top:50%;left:0;right:0;height:1.4px;transform:translateY(-50%)}
.hd .sp{flex:1}
.iconbtn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;
  cursor:pointer;color:var(--muted);font-weight:600;font-family:inherit}
.iconbtn:active{background:var(--panel2)}

.page{max-width:480px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sect{margin-bottom:14px}
.sect-h{display:flex;align-items:baseline;gap:8px;margin-bottom:9px;padding:0 2px}
.sect-h h2{font-size:15px;font-weight:800;letter-spacing:-.2px}
.sect-h .hint{font-size:11.5px;color:var(--muted)}
.pad{padding:14px}

/* ---------- 工资帽 ---------- */
.cap{padding:12px 14px 10px}
.cap-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:7px}
.cap-top b{font-family:var(--mono);font-size:13px;color:var(--text)}
.over{color:var(--red)!important;font-weight:800}
.bar{height:8px;border-radius:5px;background:var(--line2);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .2s}

/* ---------- 阵容槽 ---------- */
.slots{display:flex;flex-direction:column}
.slot{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;
  border-top:1px solid var(--line2);cursor:pointer;transition:background .13s}
.slot:first-child{border-top:none}
.slot:active{background:var(--panel2)}
.slot.empty .sl-add{color:var(--dim);font-size:13.5px}
.sl-pos{width:28px;flex:none;font-weight:800;font-size:12.5px;color:var(--blue);text-align:center;font-family:var(--mono)}
.sl-txt{flex:1;min-width:0}
.sl-nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-sub{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;color:var(--muted)}
.sl-sub .mono{font-family:var(--mono)}
.sl-rt{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.sl-pr{font-size:12.5px;font-weight:700;color:var(--muted);font-family:var(--mono)}
.slot .x{color:var(--dim);font-size:17px;line-height:1;padding:2px 6px;border-radius:6px}
.slot .x:active{background:var(--red-l);color:var(--red)}

.rowbtns{display:flex;gap:7px;padding:11px 14px;border-top:1px solid var(--line2)}

/* ---------- 阵容构成 ---------- */
.factbox{margin:0 14px 13px;background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:10px 12px}
.fact-h{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:1px;margin-bottom:4px}
.factbox p{font-size:12.5px;color:var(--muted);line-height:1.65}

/* ---------- 通用按钮 / 标签 ---------- */
.btn{background:var(--blue);color:#fff;border:none;border-radius:11px;padding:11px 20px;font-size:14px;
  font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.btn:active{opacity:.85}
.btn:disabled{background:#c3ccdb;cursor:not-allowed}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:13px}
.chip{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;transition:.13s;font-weight:600;color:var(--muted);user-select:none}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tabs{display:flex;gap:6px;padding:0 14px 12px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  font-size:12.5px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
select{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);outline:none;cursor:pointer;max-width:100%}

/* ---------- 底部固定条 ---------- */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.actionbar .in{max-width:480px;margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:11px}
.actionbar .status{font-size:12px;color:var(--muted);font-family:var(--mono);flex:1;min-width:0}
.actionbar .btn{flex:none;padding:12px 22px}

/* ---------- 选人抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(20,24,33,.45);z-index:100;display:flex;align-items:center;
  justify-content:center;padding:16px}
#sheetMask{align-items:flex-end;padding:0;z-index:110}
.sheet{background:var(--panel);width:100%;max-width:480px;margin:0 auto;border-radius:20px 20px 0 0;
  max-height:88vh;display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(26px);opacity:.7}to{transform:none;opacity:1}}
.sheet-hd{display:flex;align-items:center;padding:14px 16px 11px;border-bottom:1px solid var(--line2)}
.sheet-hd b{font-size:15px}
.sheet-hd .x{margin-left:auto;font-size:17px;color:var(--dim);cursor:pointer;padding:2px 8px}
.filters{padding:11px 16px 7px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line2)}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flbl{font-size:11px;color:var(--muted);font-weight:700;margin-right:2px}
input.search{width:100%;padding:9px 13px;border:1px solid var(--line);border-radius:20px;font-size:13px;
  outline:none;font-family:inherit;background:var(--panel2)}
input.search:focus{border-color:var(--blue);background:var(--panel)}
.pool{overflow-y:auto;padding:8px 16px 24px;flex:1;-webkit-overflow-scrolling:touch}
.pcard{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);
  border-radius:11px;margin-bottom:6px;cursor:pointer;background:var(--panel);transition:.12s}
.pcard:active{border-color:var(--blue);background:var(--blue-l)}
.pcard.dis{opacity:.34}
.pcard .info{flex:1;min-width:0}
.pcard .n{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .m{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.pcard .p{font-size:13px;font-weight:700;font-family:var(--mono);flex:none}
.posb{font-size:10.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);
  border-radius:5px;padding:1px 5px;flex:none;font-family:var(--mono)}
.pempty{padding:36px;text-align:center;color:var(--dim);font-size:13px}

/* ---------- 结果 ---------- */
.rs-win{padding:22px 18px 4px;text-align:center}
.rs-lbl{font-size:10.5px;font-weight:700;color:var(--dim);letter-spacing:2px;margin-bottom:8px}
.rs-who{font-size:27px;font-weight:800;line-height:1.22;letter-spacing:-.6px}
.rs-who span{font-size:15px;font-weight:700}
.rs-hl{margin-top:9px;font-size:15px;font-weight:700;line-height:1.5}
.rs-styles{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:13px 18px 0}
.stl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
  background:var(--panel2);border:1px solid var(--line2);padding:4px 10px;border-radius:20px}
.stl i{width:7px;height:7px;border-radius:50%;display:block;flex:none}
.rs-verdict{padding:15px 18px 4px;font-size:13.5px;line-height:1.85;color:var(--muted)}
.rs-verdict p{margin-bottom:7px}
.rs-verdict p:last-child{margin-bottom:0}
.rs-sec{padding:16px 18px 2px;font-size:10.5px;font-weight:700;color:var(--dim);letter-spacing:2px;
  border-top:1px solid var(--line2);margin-top:16px}
.steps{padding:4px 18px 12px}
.step{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line2)}
.step:last-child{border-bottom:none}
.step-n{flex:none;width:21px;height:21px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;
  font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
.step-b{min-width:0}
.step-b b{display:block;font-size:13.5px;margin-bottom:4px}
.step-b p{font-size:13px;color:var(--muted);line-height:1.8}
.mus{padding:4px 18px 12px}
.mu{padding:11px 0;border-bottom:1px dashed var(--line2)}
.mu:last-child{border-bottom:none}
.mu-t{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:5px;flex-wrap:wrap}
.mu-vs{font-size:11px;color:var(--dim);background:var(--panel2);border:1px solid var(--line2);
  padding:1px 7px;border-radius:10px;font-weight:600}
.mu-d{font-size:12.5px;color:var(--muted);line-height:1.75}
.rs-acts{display:flex;gap:8px;padding:14px 18px 18px;border-top:1px solid var(--line2);margin-top:8px}
.rs-acts .btn{flex:1;padding:11px 8px;font-size:13.5px}

/* ---------- 折叠 / 九维 ---------- */
.morewrap{padding:0 18px 16px}
.morebtn{width:100%;padding:10px;border:1px dashed var(--line);background:transparent;border-radius:11px;
  font-size:12.5px;color:var(--muted);cursor:pointer;font-family:inherit;font-weight:600}
.morebtn:active{border-color:var(--blue);color:var(--blue)}
.morebox{padding-top:14px}
.dimhead{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;margin-bottom:11px}
.dimrow{display:grid;grid-template-columns:34px 1fr 34px;gap:9px;align-items:center;margin-bottom:9px}
.dimrow .dl{font-size:12px;font-weight:700;text-align:right;font-family:var(--mono)}
.dimrow .dr{font-size:12px;font-weight:700;font-family:var(--mono)}
.dimrow .mid{display:flex;gap:4px;align-items:center}
.dimrow .dmn{flex:none;width:60px;text-align:center;font-size:10.5px;color:var(--muted)}
.half{flex:1;height:7px;background:var(--line2);border-radius:5px;overflow:hidden;display:flex}
.half.l{justify-content:flex-end}
.half i{display:block;height:100%}
.dimfoot{font-size:11.5px;color:var(--dim);line-height:1.65;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line2)}

/* ---------- 其它 ---------- */
.loader{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px;padding:26px 18px}
.spin{width:15px;height:15px;border:2.5px solid var(--line);border-top-color:var(--blue);border-radius:50%;
  animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.note{font-size:11.5px;color:var(--dim);padding:11px 18px 14px;border-top:1px dashed var(--line2);line-height:1.65}
.note.bad{border-left:3px solid var(--red);text-align:left;font-size:12.5px;line-height:1.75;color:var(--muted)}
.code{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px;font-family:var(--mono);
  font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;line-height:1.55}
textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:12px;
  font-family:var(--mono);outline:none;resize:vertical;min-height:62px;background:var(--panel2)}

/* ---------- 弹窗 ---------- */
.modal{background:var(--panel);border-radius:16px;max-width:480px;width:100%;max-height:86vh;
  overflow-y:auto;padding:20px}
.modal h3{font-size:16px;margin-bottom:5px}
.modal .desc{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.7}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}
.fld input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;
  font-family:inherit;outline:none;background:var(--panel2)}
.fld input:focus{border-color:var(--blue);background:var(--panel)}
.fld .tip{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.6}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.preset{display:inline-block;padding:6px 11px;margin:0 6px 7px 0;border-radius:999px;font-size:12.5px;
  border:1px solid var(--line);background:var(--panel2);cursor:pointer;user-select:none}
.preset.on{border-color:var(--blue);background:var(--blue-l);box-shadow:0 0 0 2px var(--blue-l)}
.preset.no{opacity:.5}
.preset b{font-weight:700}
.preset em{font-style:normal;color:var(--muted);font-size:11px;margin-left:3px}
.diag{margin-top:10px;padding:10px 12px;border-radius:9px;font-size:12.5px;line-height:1.7;
  background:var(--panel2);border:1px solid var(--line);white-space:pre-wrap;word-break:break-all}
.diag.ok{background:var(--green-l);border-color:#bfe3ce;color:var(--green)}
.diag.bad{background:var(--red-l);border-color:#f3c6ce;color:var(--red)}
.modal table th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:5px 4px;border-bottom:1px solid var(--line)}
.modal table td{padding:5px 4px;border-bottom:1px solid var(--line2)}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#141821;color:#fff;
  padding:10px 20px;border-radius:22px;font-size:13px;z-index:200;opacity:0;transition:.25s;
  pointer-events:none;font-weight:600;max-width:88vw;text-align:center}
.toast.on{opacity:1;bottom:106px}

@media(max-width:360px){
  .rs-who{font-size:23px}
  .actionbar .btn{padding:11px 16px}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="logo"><span class="ball"></span>首发五人对决</div>
    <span class="sp"></span>
    <button class="iconbtn" id="dataBtn">怎么玩</button>
    <button class="iconbtn" id="cfgBtn">模型</button>
  </div>
</header>

<main class="page">

  <!-- ① 组队 -->
  <section class="sect">
    <div class="sect-h"><h2>① 你的首发五人</h2><span class="hint">工资帽 100%</span></div>
    <div class="card">
      <div class="cap">
        <div class="cap-top"><span>工资帽</span><b id="budgetTxt">0% / 100%</b></div>
        <div class="bar" id="bar"></div>
      </div>
      <div class="slots" id="slots"></div>
      <div class="rowbtns">
        <button class="chip" id="clearBtn">清空</button>
        <button class="chip" id="randBtn">随机一支</button>
      </div>
      <div class="factbox hide" id="myProfile" style="margin-top:0;margin-bottom:0;border:none;border-top:1px solid var(--line2);border-radius:0">
        <div class="fact-h">阵容构成</div>
        <p id="myDesc"></p>
      </div>
    </div>
  </section>

  <!-- ② 对手 -->
  <section class="sect">
    <div class="sect-h"><h2>② 挑对手</h2><span class="hint">三选一</span></div>
    <div class="card">
      <div class="tabs" id="oppTabs" style="padding:12px 14px 10px">
        <span class="tab on" data-m="team">真实球队</span>
        <span class="tab" data-m="manual">自己组</span>
        <span class="tab" data-m="link">挑战码</span>
      </div>

      <div id="oppTeam" style="padding-bottom:8px">
        <div style="padding:0 14px 11px"><select id="teamSel" style="width:100%"></select></div>
        <div class="slots" id="oppSlots"></div>
      </div>

      <div id="oppManual" class="hide" style="padding-bottom:8px">
        <div style="padding:0 14px 9px;font-size:12px;color:var(--muted)">点下面的位置自己挑五个人</div>
        <div class="slots" id="oppSlots2"></div>
      </div>

      <div id="oppLink" class="hide">
        <div style="padding:0 14px 12px">
          <textarea id="codeIn" placeholder="粘贴朋友发来的挑战码…"></textarea>
          <div style="display:flex;gap:8px;margin-top:9px">
            <button class="btn sm" id="loadCodeBtn" style="flex:1">载入对手阵容</button>
            <button class="btn ghost sm" id="copyCodeBtn" style="flex:1">复制我的码</button>
          </div>
          <div class="code" id="myCode" style="margin-top:11px">先组满五人，这里会自动生成。</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ③ 结果 -->
  <section class="sect hide" id="resultSect">
    <div class="sect-h"><h2>③ 分析结果</h2></div>
    <div class="card" id="resultCard"></div>
  </section>

  <div style="text-align:center;font-size:11px;color:var(--dim);padding:6px 20px 18px;line-height:1.7">
    球员名单为 2026-27 赛季开季预测阵容，数值参考 2025-26 常规赛数据<br>本工具为增长玩法原型，与 NBA 官方无关
  </div>
</main>

<!-- 底部固定条 -->
<div class="actionbar">
  <div class="in">
    <span class="status" id="statusTxt">还没开始</span>
    <button class="btn" id="goBtn" disabled>开始分析</button>
  </div>
</div>

<!-- 选人抽屉 -->
<div class="mask hide" id="sheetMask">
  <div class="sheet">
    <div class="sheet-hd"><b id="sheetTitle">选人</b><span class="x" id="sheetClose">✕</span></div>
    <div class="filters" id="filters"></div>
    <div class="pool" id="pool"></div>
  </div>
</div>

<div class="mask hide" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ========== 规则与球员数据库 ==========
   分档依据：《2026-27 NBA 季前球员评级分档》（10-12 分制）
   定价依据：每一档身价 = 该级别球员占真实工资帽的比例（顶薪 35/33/28/24，全额中产 10，迷你中产 7，底薪 2）
   名单口径：2026-27 开季预测阵容 · 数据口径：2025-26 常规赛 */
const CAP = 100;
const TIERS = {
  11:{n:"MVP领跑者", p:35, c:"#a1122c", bg:"#fdebed"},
  10:{n:"MVP候选人", p:33, c:"#c8382b", bg:"#fdeeea"},

/* ================= 推演引擎 ================= */
const POS = ["PG","SG","SF","PF","C"];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const has=(p,t)=>p.tags.indexOf(t)>=0;
const POSN = {PG:"控卫",SG:"分卫",SF:"小前",PF:"大前",C:"中锋"};

const PLAYERS = RAW.map((r,i)=>({
  i:i, en:r[0], cn:r[1], team:r[2], pos:r[3], tier:r[4], score:r[5], gp:r[6],
  ppg:r[7], rpg:r[8], apg:r[9], spg:r[10], bpg:r[11],
  fg:r[12]/1000, tp:r[13]/1000, tpm:r[13],
  tags:(r[14]||"").split(",").filter(Boolean),
  price:TIERS[r[4]].p
}));
const TN = t => TIERS[t].n;          // 档位名称
/* 队名简称 —— 模型经常只写"掘金""湖人"这种简称，纠错时要认得出来 */
const TEAM_SHORT={
  ATL:"老鹰", BOS:"凯尔特人", BKN:"篮网", CHA:"黄蜂", CHI:"公牛", CLE:"骑士", DAL:"独行侠", DEN:"掘金",
  DET:"活塞", GSW:"勇士", HOU:"火箭", IND:"步行者", LAC:"快船", LAL:"湖人", MEM:"灰熊", MIA:"热火",
  MIL:"雄鹿", MIN:"森林狼", NOP:"鹈鹕", NYK:"尼克斯", OKC:"雷霆", ORL:"魔术", PHI:"76人", PHO:"太阳",
  POR:"开拓者", SAC:"国王", SAS:"马刺", TOR:"猛龙", UTA:"爵士", WAS:"奇才"
};
/* 这两个属性不给玩家看，只用来排角色和算化学反应的 */

/* --- 各维度原始打分 --- */
function dSpacing(p){
  let x = clamp((p.tpm-250)/1.7, 0, 100);
  if(has(p,"三分")) x=Math.min(100,x+10);
  if(has(p,"无球跑动")) x=Math.min(100,x+5);
  if(has(p,"无空间")) x=Math.max(0,x-20);
  return x;
}
function dRim(p){
  let x = clamp((p.bpg-0.3)*42, 0, 68);
  x += p.pos==="C"?18 : p.pos==="PF"?10 : p.pos==="SF"?4 : 0;
  if(has(p,"护框")) x+=20;
  if(has(p,"体型优势")) x+=8;
  return clamp(x,0,100);
}
function dPerimeter(p){
  let x = clamp((p.spg-0.6)*42, 0, 62);
  if(has(p,"外线防守")) x+=24;
  if(has(p,"换防")) x+=12;
  if(has(p,"抢断")) x+=8;
  if(p.pos==="PG"||p.pos==="SG"||p.pos==="SF") x+=6;
  if(has(p,"小个子")) x-=6;
  return clamp(x,0,100);
}
function dRebound(p){
  let x = clamp((p.rpg-2.5)*8.5, 0, 72);
  if(p.pos==="C") x+=12; else if(p.pos==="PF") x+=7;
  if(has(p,"篮板")) x+=10;
  return clamp(x,0,100);
}
function dPlay(p){
  let x = clamp((p.apg-1.5)*11, 0, 72);
  if(has(p,"组织核心")) x+=20;
  if(has(p,"策应")) x+=14;
  if(has(p,"持球大核")) x+=10;
  return clamp(x,0,100);
}
function dCreate(p){
  let x = clamp((p.ppg-8)*4.6, 0, 100);
  if(has(p,"持球大核")) x+=16;
  if(has(p,"单打")) x+=12;
  if(has(p,"关键球")) x+=10;
  if(has(p,"低位")) x+=8;
  if(has(p,"造犯规")) x+=5;
  return clamp(x,0,100);
}
function dInterior(p){
  let x = clamp((p.fg*1000-400)/2.2, 0, 100);
  x *= (p.pos==="C"||p.pos==="PF")?1.05:0.78;
  if(has(p,"内线终结")) x+=16;
  if(has(p,"吃饼")) x+=12;
  if(has(p,"空接")) x+=8;
  if(has(p,"低位")) x+=10;
  return clamp(x,0,100);
}
function dPace(p){
  let x = 50;
  if(has(p,"转换")) x+=22;
  if(has(p,"快攻")) x+=20;
  if(has(p,"慢节奏")) x-=22;
  if(has(p,"挡拆")) x+=6;
  if(p.pos==="C") x-=8; else if(p.pos==="PF") x-=4;
  if(has(p,"老将")) x-=5;
  return clamp(x,0,100);
}
function dHealth(p){
  let x = p.gp>=72?100 : p.gp>=62?86 : p.gp>=52?74 : p.gp>=42?60 : p.gp>=28?44 : p.gp>=14?30 : 14;
  if(has(p,"伤病隐患")) x-=12;
  if(has(p,"重伤初愈")) x=Math.min(x,20);
  return clamp(x,0,100);
}
/* ================= 角色分层 =================
   五个人不是五个"能力块"捏在一起。真实比赛里一定会打战术，
   打战术就意味着球权集中在两三个人手里，剩下的人要干脏活：
   蹲底角、做掩护、卡位、补防、冲抢。

   关键：一个习惯有球的球星，被排到第四、第五选择去干脏活时，
   他在这件事上的产出，很可能还不如一个专职 3D —— 因为他本来就不干这个。
   所以要先算出每个人的"球权需求"和"无球价值"，再把他们排成 1~5 号选择。 */

/* 球权需求：这个人必须有球在手才能发挥（越高越是"要球的"） */
function dUsage(p){
  let x = dCreate(p)*0.52 + dPlay(p)*0.28;
  if(has(p,"持球大核")) x+=16;
  if(has(p,"单打"))     x+=12;
  if(has(p,"组织核心")) x+=10;
  if(has(p,"低位"))     x+=10;
  if(has(p,"突破"))     x+=8;
  if(has(p,"造犯规"))   x+=6;
  if(has(p,"关键球"))   x+=5;
  if(has(p,"吃饼"))     x-=16;
  if(has(p,"无球跑动")) x-=10;
  if(has(p,"空间型内线")) x-=8;
  if(has(p,"护框"))     x-=6;
  if(has(p,"三分"))     x-=4;
  return clamp(x,0,100);
}
/* 无球价值：不拿球也能帮到球队的部分 —— 底角三分、掩护、卡位、补防、冲抢 */
function dGlue(p){
  /* 脏活分两条路子，位置不同、干法不同：
     后卫是接球就投、无球跑位、盯人；内线是掩护、卡位、护框、冲抢。
     两条路各算一遍取高的那个，否则会让后卫在"篮板护框"上白挨一刀。 */
  const guardSide = dSpacing(p)*0.44 + dPerimeter(p)*0.40 + dInterior(p)*0.16;
  const bigSide   = dRebound(p)*0.34 + dRim(p)*0.34 + dInterior(p)*0.16 + dSpacing(p)*0.16;
  let x = (guardSide+bigSide)/2*0.35 + Math.max(guardSide,bigSide)*0.65;
  if(has(p,"无球跑动")) x+=16;
  if(has(p,"引力"))     x+=26;   /* 无球牵制力 —— 数据里明确标注了，引擎以前白白浪费了这个标签 */
  if(has(p,"挡拆"))     x+=10;
  if(has(p,"篮板"))     x+=9;
  if(has(p,"护框"))     x+=9;
  if(has(p,"吃饼"))     x+=9;
  if(has(p,"换防"))     x+=10;
  if(has(p,"空间型内线")) x+=8;
  if(has(p,"抢断"))     x+=10;
  if(has(p,"外线防守")) x+=6;    /* 防守型工兵的价值不该被抢断数据埋没 */
  if(has(p,"持球大核")) x-=9;
  if(has(p,"单打"))     x-=7;
  return clamp(x,0,100);
}

const ROLE_NAME=["主攻点","副攻点","第三点","功能位","蓝领位"];
/* 每个角色位对各项能力的重要程度。这就是现代篮球的分工：
   前两位要能持球自己解决问题；后两位要能干脏活（掩护、卡位、底角三分、补防）。
   注意 create 这一行：一号位 2.2，五号位只有 0.15 —— 单打能力放在蓝领位上几乎不值钱。 */
const ROLE_W={
  create:  [2.20, 1.70, 0.85, 0.30, 0.15],
  play:    [1.90, 1.20, 1.00, 0.75, 0.65],
  spacing: [1.00, 1.00, 1.15, 1.35, 1.45],
  rebound: [0.55, 0.70, 1.00, 1.45, 1.75],
  rim:     [0.35, 0.55, 1.00, 1.55, 1.85],
  perim:   [1.25, 1.30, 1.15, 0.95, 0.80],
  interior:[0.80, 0.90, 1.10, 1.20, 1.30],
  pace:    [1.30, 1.20, 1.00, 0.85, 0.75],
  health:  [1.00, 1.00, 1.00, 1.00, 1.00]
};
function roleMean(vals, weights){
  let num=0, den=0;
  for(let i=0;i<vals.length;i++){ const w=(weights&&weights[i])||1; num+=vals[i]*w; den+=w; }
  return den? num/den : 0;
}
/* 按球权需求从高到低，排出 1~5 号选择 */
function assignRoles(L){
  return L.slice().sort((a,b)=> b.usg-a.usg)
          .map((p,i)=>({ p:p, role:i+1, name:ROLE_NAME[i], usg:Math.round(p.usg), glue:Math.round(p.glue) }));
}
PLAYERS.forEach(function(p){ p.usg=dUsage(p); p.glue=dGlue(p); });

const DIMS=[
  {k:"spacing", n:"空间拉开", w:1.15, f:dSpacing},
  {k:"create",  n:"持球硬解", w:1.20, f:dCreate},
  {k:"interior",n:"内线终结", w:0.95, f:dInterior},
  {k:"rim",     n:"护框",     w:1.10, f:dRim},
  {k:"perim",   n:"外线防守", w:1.10, f:dPerimeter},
  {k:"rebound", n:"篮板",     w:0.90, f:dRebound},
  {k:"play",    n:"组织串联", w:1.00, f:dPlay},
  {k:"pace",    n:"转换节奏", w:0.70, f:dPace},
  {k:"health",  n:"健康续航", w:0.85, f:dHealth}
];
/* 有"老大属性"的维度更看重最高点，靠整体堆的维度更看重均值 */
const BLEND={spacing:.42, create:.60, rim:.55, perim:.52, rebound:.32, play:.18, interior:.40, pace:.20, health:.15};
function blendD(vals, wMax, roleW){
  const s=vals.slice().sort((a,b)=>b-a);
  const mean=roleMean(vals, roleW);      /* 按角色位加权，而不是简单平均 */
  return mean*(1-wMax)+s[0]*wMax;
}

/* --- 阵容画像 ---
   只做「事实描述」：九个观察维度的数值、角色分工、总身价、评分合计、阵容构成。
   这里【不产出任何胜负判定、评分或结论】—— 判断交给大模型。 */
function profile(lineup){
  const d={};
  const roles=assignRoles(lineup);
  const ordered=roles.map(r=>r.p);
  DIMS.forEach(dim=>{
    d[dim.k]=blendD(ordered.map(dim.f), BLEND[dim.k], ROLE_W[dim.k]);
  });
  const sumAp=lineup.reduce((a,p)=>a+p.apg,0);
  d.play=clamp(d.play*0.45 + clamp(sumAp*3.0,0,100)*0.55, 0, 100);
  const sumRb=lineup.reduce((a,p)=>a+p.rpg,0);
  d.rebound=clamp(d.rebound*0.5 + clamp((sumRb-16)*3.4,0,100)*0.5, 0, 100);
  return {
    dim:d, roles,
    price: lineup.reduce((a,p)=>a+p.price,0),
    talent: lineup.reduce((a,p)=>a+p.score,0),
    fact: lineupFact(lineup, roles)
  };
}

/* 阵容构成的客观事实（都不含评价） */
function lineupFact(L, roles){
  return {
    shooters: L.filter(p=>p.tpm>=250).length,          /* 有稳定三分出手的人数 */
    bigs:     L.filter(p=>p.pos==="C"||p.pos==="PF").length,
    needBall: roles.filter(r=>r.usg>=70).length,        /* 需要球在手的人 */
    topTier:  L.filter(p=>p.tier>=10).length,
    lead:     roles[0].p.cn,
    leadUsg:  roles[0].usg
  };
}

/* --- 对阵 ---
   只输出「两边在九个维度上各是多少」。
   这里【不做任何胜负判定】：不比分、不算 margin、不判谁赢。
   九维数值只是给大模型的一组「观察角度建议」，不是结论，模型可以推翻。 */
function matchup(A,B){
  const pa=profile(A), pb=profile(B);
  const edges=DIMS.map(function(dim){
    const a=pa.dim[dim.k], b=pb.dim[dim.k];
    return {k:dim.k, n:dim.n, a:a, b:b, diff:a-b};
  });
  return {pa:pa, pb:pb, edges:edges};
}

/* --- 组队辅助 --- */
function lineupPrice(L){return L.reduce((a,p)=>a+p.price,0);}
function rosterScore(L){return L.reduce((a,p)=>a+p.score,0);}
function canAdd(L,p){
  if(!p) return {ok:false,why:""};
  if(L.length>=5) return {ok:false,why:"阵容已满"};
  if(L.some(x=>x.i===p.i)) return {ok:false,why:"已在这套阵容里"};
  if(L.some(x=>x.pos===p.pos)) return {ok:false,why:`已经有${POSN[p.pos]}了`};
  if(lineupPrice(L)+p.price>CAP) return {ok:false,why:`工资帽不够（还差 ${lineupPrice(L)+p.price-CAP}）`};
  return {ok:true,why:""};
}
function teamBestFive(code){
  const pool=PLAYERS.filter(p=>p.team===code);
  const out=[]; const used={};
  POS.forEach(pos=>{
    const cand=pool.filter(p=>p.pos===pos&&!used[p.i]).sort((a,b)=>b.price-a.price||b.ppg-a.ppg)[0];
    if(cand){out.push(cand);used[cand.i]=1;}
  });
  if(out.length<5){
    pool.filter(p=>!used[p.i]).sort((a,b)=>b.price-a.price).forEach(p=>{
      if(out.length<5){out.push(p);used[p.i]=1;}
    });
  }
  return out.slice(0,5);
}
function randomLineup(){
  for(let t=0;t<400;t++){
    const L=[];
    POS.forEach(pos=>{
      const cands=PLAYERS.filter(p=>p.pos===pos&&canAdd(L,p).ok);
      if(cands.length){
        const w=cands.filter(p=>lineupPrice(L)+p.price<=CAP);
        if(w.length) L.push(w[Math.floor(Math.random()*w.length)]);
      }
    });
    if(L.length===5) return L;
  }
  return [];
}

/* 球员卡片：只留判断阵容必需的信息（位置 / 档次 / 评级 / 球队），一行一个。
   详细数据只给关键球员 —— 给太多反而会淹没重点。 */
function card(p){
  /* 故意不给球员的球队名 —— 实测模型会因为阵容里有个湖人球员，就把整套阵容叫成"湖人"。
     分析关心的是球员类型和搭配，球队归属没有用，反而是个干扰源。 */
  return `· ${p.cn}｜${POSN[p.pos]}｜${TN(p.tier)}（评级 ${p.score}）｜场均 ${p.ppg} 分 ${p.rpg} 板 ${p.apg} 助`;
}
/* 关键球员的详细数据：按评级取前 3 个，其余只给一个场均得分。
   数据只给关键的几个人，给太多会淹没重点。 */
function keyData(L){
  const sorted=L.slice().sort(function(a,b){ return b.score-a.score; });
  const key=sorted.slice(0,3), rest=sorted.slice(3);
  let out=key.map(function(p){
    const tp = p.tpm? ((p.tp*100).toFixed(1)+"%") : "基本不出手";
    return `· ${p.cn}：投篮 ${(p.fg*100).toFixed(1)}% · 三分 ${tp} · 技术特点：${p.tags.join("、")||"无"}`;
  }).join("\n");
  if(rest.length) out += "\n· 其余球员： " + rest.map(function(p){ return p.cn+" "+p.ppg+"分"; }).join(" / ");
  return out;
}
/* 如果五个人都来自同一支球队，就把队名说清楚；
   否则明确告诉模型"这五个人来自不同球队" ——
   实测模型会因为阵容里有一个湖人球员，就把整套阵容叫成"湖人"。 */
function teamLabel(L){
  const cnt={};
  L.forEach(function(p){ cnt[p.team]=(cnt[p.team]||0)+1; });
  const ks=Object.keys(cnt);
  return ks.length===1? TEAMS[ks[0]] : null;
}
/* 球权需求排序（按平时持球的多少排）—— 只作参考，帮模型判断风格能不能互补 */
function usageText(pr){

/* 只给九维数值本身，不给任何"结论"式的描述 —— 引擎的结论不可靠，
   把它当结论会误导大模型；给原始数值，让它自己解读。 */
function profileText(pr){
  const order=["create","spacing","interior","rim","perim","rebound","play","pace","health"];

  return order.map(k=>`${nm[k]} ${Math.round(pr.dim[k])}`).join(" | ");
}

/* ---------- 输出纠错：抹掉不该出现的球队名 ----------
   免费模型有很强的语言惯性（"掘金 vs 湖人"是常见搭配），光靠指令压不住。
   这里做一道确定性兜底：
   · 如果某一边是"某支真实球队的首发"，那个队名是允许的（模型说对了就留着）
   · 其它任何球队名一律抹掉 —— 抹掉比替换安全，因为替换可能换错边（把对手说成"我的阵容"）。 */
function cleanTeamNames(out, A, B){
  const allowed={};
  const soloA=teamLabel(A), soloB=teamLabel(B);
  if(soloA) allowed[soloA]=1;
  if(soloB) allowed[soloB]=1;
  const fix=function(str){
    if(!str) return str;
    let t=String(str);
    Object.keys(TEAMS).forEach(function(c){
      if(allowed[TEAMS[c]]) return;                 /* 这一队是场上真实存在的，允许出现 */
      [TEAMS[c], TEAM_SHORT[c]].forEach(function(nm){
        if(nm && t.indexOf(nm)>=0) t=t.split(nm).join("");
      });
    });
    return t.replace(/^[，、。：\s]+/,"").replace(/\s{2,}/g," ").replace(/[，、]{2,}/g,"，").replace(/^[，、。]/,"");
  };
  ["headline","verdict","styleA","styleB"].forEach(function(k){ if(out[k]) out[k]=fix(out[k]); });
  (out.process||[]).forEach(function(x){ if(x.d) x.d=fix(x.d); });
  (out.matchups||[]).forEach(function(x){ if(x.d) x.d=fix(x.d); });
  return out;
}

function assertFree(cfg){

  if(c.freeOnly===false) return;
  if(isFreeModel(c.model, c.base)) return;
  const err=new Error("这个模型不在免费名单里，已经拦下，请求没有发出去");
  err.kind="notfree";
  err.detail="当前模型："+c.model+"　接口："+c.base;

}
/* 各家把错误码放在 body 里，而且状态码会骗人：
   智谱的「余额不足」和「达到速率限制」都返回 HTTP 429。所以以 body 里的 code 为准。 */
function readApiError(body){
  try{
    const d=JSON.parse(body);
    const e=d.error||d;
    return { code:String(e.code||""), msg:String(e.message||e.msg||"").slice(0,180) };
  }catch(e){
    return { code:"", msg:String(body||"").replace(/\s+/g," ").slice(0,180) };
  }
}

async function callLLM(cfg, system, user, onWait, _try){
  assertFree(cfg);
  const attempt = _try||0;
  const url = cfg.base.replace(/\/+$/,"") + "/chat/completions";
  let res;
  try{
    res = await fetch(url,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},
      body:JSON.stringify({
        model: cfg.model,
        temperature: 0.85,
        messages:[{role:"system",content:system},{role:"user",content:user}]
      })
    });
  }catch(e){
    const err=new Error("连不上接口");
    err.kind="connect"; err.detail=e.message;
    throw err;
  }
  if(!res.ok){
    const t = await res.text().catch(()=> "");
    const info = readApiError(t);
    const err = new Error("接口返回 "+res.status);
    err.kind = "http"; err.status = res.status;
    err.code = info.code;
    /* 详情一定要有内容 —— 服务端偶尔返回空 body，那样报错就只剩一句"接口返回了错误" */
    err.detail = "HTTP "+res.status
      + (info.code? "　错误码 "+info.code : "")
      + (info.msg? "："+info.msg : "（返回体是空的，多半是服务端限流或临时故障，等一会儿再试）");
    if(info.code==="1113")        err.kind="nobalance";
    else if(info.code==="1302")   err.kind="ratelimit";
    else if(res.status===401||res.status===403) err.kind="auth";
    else if(res.status===429)     err.kind="ratelimit";
    const WAITS=[4,10];
    if(err.kind==="ratelimit" && attempt<WAITS.length){
      const wait=WAITS[attempt];
      if(typeof onWait==="function") onWait("免费额度被限流了，等 "+wait+" 秒自动重试（第 "+(attempt+2)+" 次）…");
      await new Promise(function(r){ setTimeout(r, wait*1000); });
      return callLLM(cfg,system,user,onWait,attempt+1);
    }
    throw err;
  }
  let data;
  try{
    data = await res.json();
  }catch(parseErr){
    const err=new Error("接口返回的不是 JSON");
    err.kind="http"; err.status=res.status;
    err.detail="HTTP "+res.status+"　返回体不是 JSON（服务端限流或临时故障，等十几秒再试）";
    throw err;
  }
  if(data.error){
    const info=readApiError(JSON.stringify(data));
    const err=new Error("接口返回错误");
    err.kind = info.code==="1113"?"nobalance" : info.code==="1302"?"ratelimit" : "http";
    err.code=info.code; err.status=res.status;
    err.detail="HTTP "+res.status+(info.code? "　错误码 "+info.code : "")+(info.msg? "："+info.msg : "");
    throw err;
  }
  const txt = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
  if(!txt){ const err=new Error("接口没有返回内容"); err.kind="empty"; err.detail=""; throw err; }

  try{ return parseJSON(txt); }catch(e){}
  try{ return parseJSONLenient(txt); }catch(e){}
  const fixed = await repairJSON(cfg, txt);
  if(fixed) return fixed;
  const err=new Error("模型返回的不是合法 JSON");
  err.kind="parse"; err.detail=txt.slice(0,400);
  throw err;
}

async function repairJSON(cfg, broken){
  try{
    const r = await fetch(cfg.base.replace(/\/+$/,"")+"/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},
      body:JSON.stringify({
        model:cfg.model, temperature:0.1,
        messages:[
          {role:"system",content:"你是一个 JSON 修复器。用户会给你一段格式损坏的 JSON，请把它修成合法 JSON 后原样输出。要求：所有引号、冒号、逗号必须是英文半角；键名和字符串必须用英文双引号；不要增删任何字段和内容；只输出 JSON，不要任何解释、不要代码块。"},
          {role:"user",content:"把下面这段修成合法 JSON：\n\n"+String(broken).slice(0,4000)}
        ]
      })
    });
    if(!r.ok) return null;
    const d=await r.json();
    const t=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";
    if(!t) return null;
    try{ return parseJSON(t); }catch(e){}
    try{ return parseJSONLenient(t); }catch(e){ return null; }
  }catch(e){ return null; }
}

function parseJSONLenient(txt){
  const src = String(txt);
  const a = src.indexOf("{"), b = src.lastIndexOf("}");
  if(a<0||b<=a) throw new Error("no json");
  let body = src.slice(a,b+1);

  /* 第一层：模型在中文语境里会把 JSON 的标点"顺手"打成全角。
     只要把【结构位置】上的全角标点换回半角，字符串内部的中文标点不用动。 */
  body = body
    .replace(/([{,]\s*)"([A-Za-z_][A-Za-z0-9_]*):"(?=[^"\s])/g, '$1"$2":"')
    .replace(/\u201d\s*\uff0c\s*\u201c/g,'","')
    .replace(/\u201d\s*\uff0c/g,'",')
    .replace(/\uff0c\s*\u201c/g,',"')
    .replace(/[\u201c\u201d]/g,'"')
    .replace(/[\u2018\u2019]/g,"'")
    .replace(/(["\]\}0-9a-zA-Z])\s*\uff1a/g,'$1:')
    .replace(/,\s*([}\]])/g,'$1');
  try{ return JSON.parse(body); }catch(e){}

  try{
    const b2 = body.replace(/"((?:[^"\\]|\\.)*)"/g, function(m,p1){
      return '"'+p1.replace(/\r/g,'').replace(/\n/g,'\\n').replace(/\t/g,'\\t')+'"';
    });
    return JSON.parse(b2);
  }catch(e){}

  try{
    let b3 = body.replace(/,\s*[^,{}\[\]]*$/,'').replace(/,\s*$/,'');
    const needC = (b3.match(/\{/g)||[]).length - (b3.match(/\}/g)||[]).length;
    const needB = (b3.match(/\[/g)||[]).length - (b3.match(/\]/g)||[]).length;
    if(needC>0 || needB>0){
      b3 = b3 + ']'.repeat(Math.max(0,needB)) + '}'.repeat(Math.max(0,needC));
      return JSON.parse(b3);
    }
  }catch(e){}

  throw new Error("no json");
}

/* 一句话版本，给 toast 这种放不下长句的地方用 */
function errShort(e){
  const k=e&&e.kind;
  return ({notfree:"模型不在免费名单里", nobalance:"账号没有余额", ratelimit:"被免费额度限流了",
           auth:"Key 被接口拒绝", connect:"连不上接口（可能被浏览器的跨域策略拦了）",
           parse:"模型返回的格式不合法", empty:"接口没有返回内容"})[k]
    || ("接口报错"+(e&&e.code? "（"+e.code+"）":""));
}

/* 把技术错误翻译成人话。重点是把「跨域被拦」和「限流」这两种最容易被误判成
   "网络不好" / "Key 写错了" 的情况区分开 —— 否则排查方向一开始就是错的。 */
function friendlyErr(e){
  const k = e && e.kind;
  if(k==="notfree")
    return "拦下了一次可能要花钱的调用 —— 当前模型不在免费名单里。免费模式开着的时候只会调用名单内的模型。真想用它，就在弹窗里把「只允许免费模型」关掉。";
  if(k==="nobalance")
    return "这个账号没有余额、也没有可用资源包（错误码 1113）。这说明当前调的其实是付费模型，或者免费额度已经用完了。免费模式下不该出现这种情况，先检查模型名有没有填错。";
  if(k==="ratelimit")
    return "被免费额度的速率限制挡住了（错误码 1302）。免费模型都有并发和频率上限，等十几秒再点一次；如果反复被拦，换回 GLM-4-Flash（它的免费额度更宽）。";
  if(k==="connect")
    return "请求根本没发出去。最常见的原因是这家接口不允许网页直接调用（被浏览器的跨域策略拦了），不是你的 Key 写错了。换成智谱就能直接连；如果一定要用这家，得挂一层本地代理。顺便也确认下网络是通的。";
  if(k==="auth")
    return "接口拒绝了这个 Key（401 / 403）。检查一下 Key 有没有复制完整、有没有过期。";
  if(k==="parse")
    return "模型答回来了，但格式不合法，自动修复那一次也没成功。免费的小模型偶尔会这样，再点一次「开始对决」通常就好。";
  if(k==="empty")
    return "接口是通的，但返回内容是空的。大概率是模型名填错了 —— 要填 API 用的模型 ID，不是控制台里的显示名。";
  return "接口返回了错误"+(e&&e.detail? "："+String(e.detail).slice(0,180)
    : ("（HTTP "+(e&&e.status?e.status:"?")+"，且没有更多信息）"));
}

function parseJSON(txt){
  let s = txt.trim();
  s = s.replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  if(a>=0 && b>a) s = s.slice(a,b+1);
  return JSON.parse(s);
}

/* 连接自检：发一个最小请求，把「到底哪一步出问题」问清楚 */
async function netDiag(cfg){
  const c=Object.assign({},DEF_CFG,cfg||{});
  const info={ base:c.base, model:c.model, ms:0, ok:false, status:0,
               proto:(typeof location!=="undefined"? location.protocol : "?"),
               origin:(function(){ try{ return location.origin; }catch(e){ return "(读不到)"; } })(),
               host:(function(){ try{ return location.host||"(空)"; }catch(e){ return "?"; } })() };
  const t0=Date.now();
  try{
    const r=await fetch(c.base.replace(/\/+$/,"")+"/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+c.key},
      body:JSON.stringify({model:c.model,messages:[{role:"user",content:"hi"}],max_tokens:1})
    });
    const body=await r.text().catch(()=> "");
    info.ms=Date.now()-t0; info.ok=r.ok; info.status=r.status; info.api=readApiError(body);
  }catch(e){
    info.ms=Date.now()-t0;
    info.errName=e.name; info.errMsg=String(e.message||"").slice(0,200);
  }
  return info;
}
function diagText(d){
  const head="页面协议："+d.proto+"　来源："+d.origin;
  if(d.ok) return "✅ 通了。HTTP "+d.status+"，耗时 "+d.ms+"ms，用的是 "+d.model+"。\n"+head;
  if(d.errName){
    return "❌ 请求根本没发出去（"+(d.errName||"")+"："+(d.errMsg||"")+"）。\n"+head
      + "\n\n最常见的原因，按可能性排：\n"
      + "① 你是在某个软件的预览窗口里打开这个文件的 —— 预览窗口通常会拦掉对外请求。"
      + "请把《NBA首发五人对决.html》用 Chrome / Edge / Safari 直接打开再试。\n"
      + "② 浏览器装了广告拦截类插件，把请求当成广告拦了，先关掉插件试试。\n"
      + "③ 网络本身不通，或者走了公司网络 / 代理。";
  }
  const code=d.api&&d.api.code;
  if(code==="1113") return "❌ 接口说「余额不足或无可用资源包」（1113）。当前模型 "+d.model+" 是付费模型，免费模式下不该出现这个。";
  if(code==="1302") return "❌ 接口说「已达到速率限制」（1302）。请求是通的，只是免费额度被限流了，等十几秒再试。";
  if(d.status===401||d.status===403) return "❌ 接口拒绝了 Key（HTTP "+d.status+"）"+(d.api?"："+d.api.msg:"")+"。检查 Key 有没有复制完整。";
  return "❌ 接口返回 HTTP "+d.status+(d.api&&d.api.msg? "："+d.api.msg : "")+"。\n"+head;
}

function filtered(){
  const q=S.f.q.toLowerCase();
  return PLAYERS.filter(p=>{
    if(S.f.pos!=="ALL" && p.pos!==S.f.pos) return false;
    if(S.f.tier!=="ALL" && p.tier!==S.f.tier) return false;
    if(S.f.team!=="ALL" && p.team!==S.f.team) return false;
    if(q && !(p.cn.indexOf(q)>=0 || p.en.toLowerCase().indexOf(q)>=0 || TEAMS[p.team].indexOf(q)>=0)) return false;
    return true;
  }).sort((a,b)=> b.tier-a.tier || b.ppg-a.ppg);
}
function renderPool(){
  const list=filtered();
  const L = S.sheet.target==="me"? S.me : S.opp;
  const box=$("#pool");
  box.innerHTML = list.length? list.map(p=>{
    const chk=canAdd(L,p), c=TIERS[p.tier];
    return `<div class="pcard ${chk.ok?"":"dis"}" data-pi="${p.i}">
      ${mark(p.tier)}

      </div>
      <span class="p" style="color:${chk.ok?"var(--text)":"var(--dim)"}">${p.price}%</span>
    </div>`;
  }).join("") : `<div class="pempty">没有符合条件的球员</div>`;
  $$("#pool .pcard").forEach(c=>c.addEventListener("click",()=>pick(+c.getAttribute("data-pi"))));
}
function pick(i){
  const p=PLAYERS[i];
  const L = S.sheet.target==="me"? S.me : S.opp;
  const chk=canAdd(L,p);
  if(!chk.ok){ toast(chk.why); return; }
  /* 同位置 заменяем */
  const same=L.findIndex(x=>x.pos===p.pos);
  if(same>=0) L.splice(same,1);
  L.push(p);
  if(S.sheet.target==="opp") S.oppMode="manual";
  closeSheet();
  renderAll();
}

/* ---------- 挑战码 ---------- */
function encodeL(L){ return "DUEL2-"+L.map(p=>p.i.toString(36)).join("."); }
function decodeL(s){
  const m=String(s).trim().match(/DUEL\d-([0-9a-z.]+)/i);
  if(!m) return null;
  const out=[];
  m[1].split(".").forEach(t=>{
    const i=parseInt(t,36);
    if(PLAYERS[i] && !out.some(p=>p.i===PLAYERS[i].i) && !out.some(p=>p.pos===PLAYERS[i].pos)) out.push(PLAYERS[i]);
  });
  return out.length===5? out : null;
}

function dimRows(m){
  const nm={create:"持球硬解",spacing:"空间拉开",interior:"内线终结",rim:"护框",perim:"外线防守",
            rebound:"篮板",play:"组织串联",pace:"转换节奏",health:"健康续航"};
  return m.edges.map(e=>{
    const a=Math.round(e.a), b=Math.round(e.b);
    const ca = e.diff>1? "var(--red)" : e.diff<-1? "#c9ced8" : "#9aa3b0";
    const cb = e.diff<-1? "var(--blue)" : e.diff>1? "#c9ced8" : "#9aa3b0";
    return `<div class="dimrow">
      <div class="dl" style="color:${e.diff>1?"var(--red)":"var(--muted)"}">${a}</div>
      <div class="mid">
        <div class="half l"><i style="width:${a}%;background:${ca}"></i></div>
        <span class="dmn">${nm[e.k]}</span>
        <div class="half r"><i style="width:${b}%;background:${cb}"></i></div>
      </div>
      <div class="dr" style="color:${e.diff<-1?"var(--blue)":"var(--muted)"}">${b}</div>
    </div>`;
  }).join("");
}

/* ---------- 结果渲染 ----------
   手机版：只给「谁赢 + 为什么 + 分析过程 + 关键对位」。
   不给比分 —— 真实比赛还有替补轮换，只比首发五人，给具体比分没有意义。 */
function renderResult(m, llm, err){
  const winA = llm ? llm.winner!=="B" : null;
  const winName = winA===null? "" : (winA? "我的阵容":"对手阵容");
  const winC = winA? "var(--red)" : "var(--blue)";

  let html = "";

  /* ① 谁赢 */
  if(winA!==null){
    html += `<div class="rs-win">
      <div class="rs-lbl">分析结果</div>
      <div class="rs-who" style="color:${winC}">${winName} <span>更可能赢</span></div>
      ${llm.headline? `<div class="rs-hl">${esc(llm.headline)}</div>`:""}
    </div>`;
    if(llm.styleA || llm.styleB){
      html += `<div class="rs-styles">
        <span class="stl"><i style="background:var(--red)"></i>我的阵容 · ${esc(llm.styleA||"—")}</span>
        <span class="stl"><i style="background:var(--blue)"></i>对手阵容 · ${esc(llm.styleB||"—")}</span>
      </div>`;
    }
    if(llm.verdict) html += `<div class="rs-verdict">${esc(llm.verdict).replace(/\n/g,"</p><p>")}</div>`;
  }else{
    html += `<div class="rs-win">
      <div class="rs-lbl">分析结果</div>
      <div class="rs-who" style="color:var(--muted);font-size:19px">暂时没有结论</div>
      <div class="rs-hl" style="font-weight:600;color:var(--muted)">大模型没接上，下面只给出两套阵容的参考维度</div>
    </div>`;
  }

  /* ② 分析过程 —— 这是这个玩法的核心，四步 */
  if(llm && llm.process && llm.process.length){
    html += `<div class="rs-sec">分 析 过 程</div><div class="steps">`
      + llm.process.map(function(x,i){
          return `<div class="step">
            <span class="step-n">${i+1}</span>
            <div class="step-b"><b>${esc(x.s||"")}</b><p>${esc(x.d||"")}</p></div>
          </div>`;
        }).join("") + `</div>`;
  }

  /* ③ 关键对位 */
  if(llm && llm.matchups && llm.matchups.length){
    html += `<div class="rs-sec">关 键 对 位</div><div class="mus">`
      + llm.matchups.slice(0,3).map(function(u){
          return `<div class="mu">
            <div class="mu-t"><b>${esc(u.a||"")}</b><span class="mu-vs">对</span><b>${esc(u.b||"")}</b></div>
            <div class="mu-d">${esc(u.d||"")}</div>
          </div>`;
        }).join("") + `</div>`;
  }

  /* ④ 九维参考对照（折叠，默认收起） */
  html += `<div class="morewrap">
    <button class="morebtn" id="moreBtn">看九维参考对照</button>
    <div class="morebox hide" id="moreBox">
      <div class="dims">
        <div class="dimhead"><span style="color:var(--red)">我的阵容 ←</span><span style="color:var(--muted)">参考维度</span><span style="color:var(--blue)">→ 对手阵容</span></div>
        ${dimRows(m)}
        <p class="dimfoot">这九个数值是用固定公式从球员数据里算出来的粗略估计，只是提示可以看哪些角度，<b>不是评分，也不是结论</b>。</p>
      </div>
    </div></div>`;

  /* ⑤ 备注与按钮 */
  if(llm){
    html += `<div class="note">由大模型分析 · 只判断胜负，不给比分（真实比赛还有替补轮换）</div>`;
  }else if(err){
    const _c=loadCfg();
    html += `<div class="note bad">
        <b>大模型没接上。</b><br>
        <b>原因：</b>${esc(String(err))}<br>
        <span style="color:var(--dim)">用的接口 <span class="mono">${esc(_c.base)}</span>，模型 <span class="mono">${esc(_c.model)}</span>。</span>
        <div style="margin-top:10px"><button class="btn sm" id="retryBtn">再试一次</button>
        <button class="btn ghost sm" id="diagBtn2" style="margin-left:8px">去设置</button></div></div>`;
  }
  html += `<div class="rs-acts">
      <button class="btn" id="rerollBtn">重新分析</button>
      <button class="btn ghost" id="copyResBtn">复制</button>
      <button class="btn ghost" id="againBtn">改阵容</button>
    </div>`;

  const card=$("#resultCard");
  card.innerHTML = html;
  const sec=$("#resultSect");
  sec.classList.remove("hide");
  sec.scrollIntoView({behavior:"smooth",block:"start"});

  const mb=$("#moreBtn");
  if(mb) mb.addEventListener("click",function(){
    const box=$("#moreBox");
    box.classList.toggle("hide");
    this.textContent = box.classList.contains("hide")? "看九维参考对照" : "收起参考对照";
  });
  const ag=$("#againBtn");
  if(ag) ag.addEventListener("click",()=>{ sec.scrollIntoView({behavior:"smooth"}); });
  const rr=$("#rerollBtn");
  if(rr) rr.addEventListener("click",()=>{ S.busy=false; runAnalysis(false); });
  const cp=$("#copyResBtn");
  if(cp) cp.addEventListener("click",()=>{
    const txt = llm
      ? `【首发五人对决】${winName}更可能赢\n${llm.headline||""}\n\n${llm.verdict||""}\n\n`
        + (llm.process||[]).map(function(x){ return "· "+x.s+"："+x.d; }).join("\n")
      : "【首发五人对决】大模型没接上，只有参考维度对照。";
    navigator.clipboard.writeText(txt).then(()=>toast("已复制"),()=>toast("复制失败"));
  });
  const rb=$("#retryBtn"); if(rb) rb.addEventListener("click",()=>{ S.busy=false; runAnalysis(false); });
  const db2=$("#diagBtn2"); if(db2) db2.addEventListener("click",openCfg);
}

/* ---------- 发起分析 ---------- */
async function runAnalysis(){
  if(S.busy) return;
  if(!rosterReady(S.me)||!rosterReady(S.opp)){ toast("先把两边五个人都组好"); return; }
  const m=matchup(S.me,S.opp);
  S.busy=true;
  const go=$("#goBtn"); if(go) go.disabled=true;
  const sec=$("#resultSect");
  sec.classList.remove("hide");
  $("#resultCard").innerHTML=`<div class="loader"><span class="spin"></span>正在看这两套阵容摆在一起会是什么局面…</div>`;
  sec.scrollIntoView({behavior:"smooth",block:"start"});

  if(!cfgReady()){
    renderResult(m,null,"没有可用的模型配置");
    S.busy=false; if(go) go.disabled=false; renderAll();
    return;
  }
  const cfg=loadCfg();
  try{
    const {system,user}=buildPrompt(S.me,S.opp,m);
    const out=await callLLM(cfg,system,user,function(msg){
      const rc=$("#resultCard");
      if(rc) rc.innerHTML='<div class="loader"><span class="spin"></span>'+esc(msg)+'</div>';
    });
    if(!out || !out.winner || (!out.verdict && !(out.process&&out.process.length)))
      throw new Error("模型返回的格式不完整");
    if(out.winner!=="A" && out.winner!=="B") out.winner = "A";
    cleanTeamNames(out, S.me, S.opp);      /* 抹掉模型顺手写错的队名 */
    renderResult(m,out,null);
  }catch(e){
    renderResult(m,null,friendlyErr(e));
    toast("大模型没接上（"+errShort(e)+"）");
  }
  S.busy=false; if(go) go.disabled=false; renderAll();
}

    ["三个最佳阵容级别 + 两个底薪", [9,9,9,2,2], "星味够，但打不赢"]
  ].map(function(e){
    const sum=e[1].reduce(function(a,t){return a+TIERS[t].p;},0);
    return '<tr><td style="font-size:12.5px">'+e[0]+'</td>'
      + '<td style="font-family:var(--mono);white-space:nowrap;font-weight:700;color:'+(sum>CAP?'var(--red)':'var(--green)')+'">'+sum+'%</td>'
      + '<td style="color:var(--muted);font-size:12px">'+(e[2]||'')+'</td></tr>';
  }).join("");
  openModal(`<h3>怎么玩</h3>
    <p class="desc">工资帽 <b>100%</b>，五个位置各选一人，合计不能超。<br>
    球员按《2026-27 季前球员评级分档》分成 11 档：<b>档位就是球员评分的整数部分</b>
    （评级 7.9 分 → 7 档，评级 11.4 分 → 11 档），所以档位永远不会高于球员的实际评分。<br>
    <b>每一档的身价 = 现实中这个级别的球星占工资帽的比例</b> —— 从顶薪 35%，一路到全额中产 10%、迷你中产 7%、双年特例 4%、老将底薪 2%。</p>
    <table style="width:100%;font-size:13px;border-collapse:collapse"><tr><th style="text-align:center">档位</th><th>占工资帽</th><th>真实薪资里的对应位置</th></tr>${rows}</table>

    <p class="desc" style="margin-top:16px"><b>为什么最多只能带 2 个顶薪？</b><br>
    两个顶薪 = ${TIERS[11].p*2}%，正好还能签三个全额中产（${TIERS[4].p}% × 3 = ${TIERS[4].p*3}%），一共 ${TIERS[11].p*2+TIERS[4].p*3}%，刚好填满。
    这就是真实 NBA 里最经典的一套建队方式：<b>两个顶薪 + 三个中产</b>。<br>
    而 ${TIERS[11].p} × 3 = ${TIERS[11].p*3}%，直接超帽 —— 三个顶薪在工资帽下是签不出来的，现实里也一样。<br>
    另外注意：五个 ${TIERS[8].p}% 的球员要花 ${TIERS[8].p*5}%，也超帽了 —— <b>连"五个全明星级别"都凑不齐</b>。</p>

    <p class="desc"><b>几套能玩得转的阵容</b></p>
    <table style="width:100%;font-size:13px;border-collapse:collapse"><tr><th>搭配</th><th>占工资帽</th><th>说明</th></tr>${ex}</table>

    <p class="desc" style="margin-top:14px"><b>胜负怎么判断</b><br>
    <b>不套规则。</b>规则算不出"适配性" —— 它不知道库里得分高但不占球，也分不清"空间拉得开"和"篮下没人"是两回事。<br>
    所以引擎只给一组<b>参考角度</b>（九个维度的数值、球权需求排序），
    <b>判断交给大模型</b> —— 它去看球员的类型和搭配，说出哪一套更可能赢、以及为什么。<br>
    <b>也不给比分。</b>真实比赛还有替补轮换，只比首发五人，报一个具体比分没有意义。</p>

    <p class="desc"><b>关于真实球队对手</b><br>
    30 支真实球队的首发不受工资帽约束 —— 这是它们的天然优势，也是难度分级。
    尼克斯、76 人、雷霆这几支是"硬仗"，挑之前先看看对面的工资帽占比。</p>

    <div class="row"><button class="btn sm" id="dmClose">知道了</button></div>`);
  $("#dmClose").addEventListener("click",closeModal);
}

/* ---------- 绑定 ---------- */
function bindAll(){
  $("#cfgBtn").addEventListener("click",openCfg);
  $("#dataBtn").addEventListener("click",openData);
  $("#mask").addEventListener("click",e=>{ if(e.target.id==="mask") closeModal(); });
  $("#sheetMask").addEventListener("click",e=>{ if(e.target.id==="sheetMask") closeSheet(); });
  $("#sheetClose").addEventListener("click",closeSheet);
  $("#goBtn").addEventListener("click",()=>runAnalysis());
  $("#clearBtn").addEventListener("click",()=>{ S.me=[]; renderAll(); });
  $("#randBtn").addEventListener("click",()=>{
    const L=randomLineup();
    if(!L.length){ toast("没抽出来，再试一次"); return; }
    S.me=L; renderAll();
  });
  $$("#oppTabs .tab").forEach(t=>t.addEventListener("click",()=>{ setOppMode(t.getAttribute("data-m")); }));
  const sel=$("#teamSel");
  sel.innerHTML=Object.keys(TEAMS).sort((a,b)=>TEAMS[a].localeCompare(TEAMS[b],"zh"))
    .map(c=>`<option value="${c}">${TEAMS[c]}</option>`).join("");
  sel.value=S.oppTeam;
  sel.addEventListener("change",e=>{ S.oppTeam=e.target.value; S.opp=teamBestFive(S.oppTeam); renderAll(); });
  $("#copyCodeBtn").addEventListener("click",()=>{
    const c=$("#myCode")._code; if(!c){ toast("先组满五人"); return; }
    const isHttp=location.protocol.indexOf("http")===0;
    const txt=isHttp? (location.origin+location.pathname+"#c="+encodeURIComponent(c)) : c;
    navigator.clipboard.writeText(txt).then(
      ()=>toast(isHttp? "挑战链接已复制，发给朋友吧" : "挑战码已复制，发给朋友，他打开同一个文件粘贴即可"),
      ()=>toast("复制失败，请手动长按选中上面的挑战码"));
  });
  $("#loadCodeBtn").addEventListener("click",()=>{
    const L=decodeL($("#codeIn").value);
    if(!L){ toast("挑战码看不懂，检查一下"); return; }
    S.opp=L; setOppMode("link"); toast("对手阵容已载入");
  });
}

/* ---------- 启动 ---------- */
function init(){
  bindAll();
  S.opp=teamBestFive(S.oppTeam);
  renderAll();
  const h=location.hash.match(/c=([^&]+)/);
  if(h){
    const L=decodeL(decodeURIComponent(h[1]));
    if(L){ S.opp=L; setOppMode("link"); toast("已载入朋友的挑战阵容，组好你的五人就能开打"); }
  }
}
init();

</script>
</body>
</html>
